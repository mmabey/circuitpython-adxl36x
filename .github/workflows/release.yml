name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A merged PR only triggers a release if it bumped `version` in pyproject.toml.
  # We detect that by checking whether a `v<version>` tag already exists.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.check-tag.outputs.is-new }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - id: check-tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run pytest

  release:
    needs: [check-version, test]
    if: needs.check-version.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # create the git tag + GitHub release
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: dist/*
